# Exercises HamiltonHills/pipeline-actions' c-pipeline end to end against the
# real SonarQube and Artifactory.
#
#   PR            build, test, Sonar, Trivy, package, SBOM
#   push to main  + upload to Artifactory as 0.0.0-<sha>
#   v* tag        + GitHub release, upload as <tag without v>
#
# Configuration (Settings -> Secrets and variables -> Actions):
#   secrets    SONAR_TOKEN, SONAR_HOST_URL (empty for SonarQube Cloud),
#              ARTIFACTORY_TOKEN
#   variables  ARTIFACTORY_URL (https://<host>/artifactory),
#              ARTIFACTORY_REPOSITORY, SONAR_ORGANIZATION (Cloud only)
# Sonar is skipped with a notice until SONAR_TOKEN is set; the upload is
# skipped until ARTIFACTORY_URL is set.
name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    uses: HamiltonHills/pipeline-actions/.github/workflows/c-pipeline.yml@c/v2
    permissions:
      contents: write        # release job creates the GitHub release
      id-token: write
      attestations: write
    with:
      package-name: c-project-test
      container: ghcr.io/hamiltonhills/c-builder:1
      release: ${{ startsWith(github.ref, 'refs/tags/v') }}
      attest: false          # private repo
      sonar-args: ${{ vars.SONAR_ORGANIZATION && format('-Dsonar.organization={0}', vars.SONAR_ORGANIZATION) || '' }}
      artifactory-publish: ${{ github.event_name != 'pull_request' && vars.ARTIFACTORY_URL != '' }}
      artifactory-url: ${{ vars.ARTIFACTORY_URL }}
      artifactory-repository: ${{ vars.ARTIFACTORY_REPOSITORY }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
